[workspace]
members = ["sbdc-cli", "sbdc-entity", "sbdc-migration", "sbdc-service", "sbdc-dto"]
resolver = "2"

[workspace.dependencies]
sea-orm = { version = "2.0.0-rc.40", features = [
    "sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-json",
    "entity-registry", "schema-sync"
] }
sea-orm-migration = { version = "2.0.0-rc.40", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
tower-http = { version = "0.6", features = ["cors"] }
base64 = "0.22"
