<!DOCTYPE html>
<html>
<head><title>SBDC</title></head>
<body style="width: 300px; font-family: sans-serif; padding: 10px;">

  <input id="serverUrl" type="text" value="http://localhost:8899" style="width: 100%; margin-bottom: 10px;" />
  <label>Deck ID:</label>
