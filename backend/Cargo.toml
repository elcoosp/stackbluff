[workspace]
resolver = "2"
members = [
    "crates/sb-game-engine",
    "crates/sb-db-repos",
    "crates/sb-db-entities",
    "crates/sb-shared-types",
    "crates/sb-contracts",
    "migration",
    "crates/sb-auth",
]

[workspace.dependencies]
password-hash = "0.6.1"
mockall = "0.14.0"
axum = "0.8.9"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
jsonwebtoken = "10.3.0"
argon2 = "0.6.0-rc.8"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "tls-rustls"] }
moka = { version = "0.12", features = ["sync"] }
async-trait = "0.1.89"
anyhow = "1.0.102"
sea-orm = { version = "2.0.0-rc.38", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "2.0.0-rc.38" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1.23.0", features = ["v7", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
derive_more = "2.1.1"
tokio = { version = "1.52.3", features = ["rt", "macros"] }
thiserror = "2.0.18"
tracing = "0.1.44"
rand = { version = "0.10.0", features = ["std_rng"] }
strum = { version = "0.28.0", features = ["derive"] }

[workspace.package]
edition = "2024"
rust-version = "1.94"
