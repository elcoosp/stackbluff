[package]
name = "sb-game-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
sb-shared-types = { path = "../sb-shared-types" }
rand = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true }

[dev-dependencies]
rand = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }
uuid = { workspace = true, features = ["v4"] }

[[bench]]
name = "hand_eval"
harness = false

