<!DOCTYPE html><html class="dark" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Terminal Interface - Cinematic</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Inter:wght@400&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "terminal-navy": "#1a1a2e",
                        "surface": "#0a0a0a",
                        "primary": "#ffffff"
                    },
                    fontFamily: {
                        "terminal": ["JetBrains Mono", "monospace"],
                        "body": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .canvas-1080 {
            width: 1080px;
            height: 1080px;
            background-color: #0a0a0a;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-top: 8px solid #1a1a2e;
            border-bottom: 8px solid #1a1a2e;
            box-sizing: border-box;
            box-shadow: inset 0 0 150px rgba(26, 26, 46, 0.4);
        }

        /* 1. Scrolling CRT Scanline */
        .scrolling-scanline {
            position: absolute;
            top: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.05);
            z-index: 45;
            pointer-events: none;
            animation: scanline-scroll 4s linear infinite;
        }

        @keyframes scanline-scroll {
            0% { top: -2px; }
            100% { top: 100%; }
        }

        /* Overlay Effects */
        .noise-overlay {
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            opacity: 0.08;
            pointer-events: none;
            z-index: 40;
        }

        .crt-scanlines {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%,
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 41;
        }

        .crt-glass {
            position: absolute;
            inset: 0;
            background: radial-gradient(
                circle at center,
                transparent 0%,
                rgba(0, 0, 0, 0.2) 60%,
                rgba(0, 0, 0, 0.5) 100%
            );
            pointer-events: none;
            z-index: 42;
        }

        /* 2. Flickering Header */
        .flicker-text {
            animation: text-flicker 0.5s infinite;
        }

        @keyframes text-flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* 3. Typing Animation */
        .typing-container {
            font-family: 'JetBrains Mono', monospace;
            font-size: 36px;
            line-height: 1.6;
            color: #ffffff;
            white-space: pre-wrap;
        }

        .cursor {
            display: inline-block;
            width: 1ch;
            background-color: #ffffff;
            animation: blink 0.8s step-end infinite;
            margin-left: 4px;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 4. Pulsing Symbol */
        .spade-symbol {
            font-size: 120px;
            color: #1a1a2e;
            position: relative;
            z-index: 20;
            animation: spade-pulse 3s ease-in-out infinite;
        }

        @keyframes spade-pulse {
            0%, 100% {
                filter: drop-shadow(0 0 0px rgba(26, 26, 46, 0));
                transform: scale(1);
            }
            50% {
                filter: drop-shadow(0 0 25px #1a1a2e);
                transform: scale(1.05);
            }
        }

        /* Subtle Phosphor Glow for text */
        .phosphor {
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="dark" style="cursor: grabbing; user-select: none;">
<!-- 1080x1080 Social Media Card Container -->
<div class="canvas-1080 flex flex-col p-12" style="width: 1080px; height: 1080px; min-width: 1080px; min-height: 1080px; aspect-ratio: 1 / 1;">
<!-- CRT Effects -->
<div class="noise-overlay"></div>
<div class="crt-scanlines"></div>
<div class="crt-glass" style="transform: translate(-1.42188px, -4.22222px);"></div>
<div class="scrolling-scanline"></div>
<!-- Header Section -->
<header class="flex items-center gap-[16px] relative z-20 font-terminal"><span class="text-[28px] font-bold text-primary flicker-text phosphor">[CLICK]</span><span class="text-[28px] text-terminal-navy opacity-30">•</span><span class="text-[28px] phosphor text-primary">Day 8</span></header>
<!-- Body Content -->
<main class="mt-[100px] flex flex-col relative z-20 max-w-[800px]">
<div class="typing-container phosphor" id="typewriter">2,598,960 possible outcomes.<br>Every combination mapped.<br>Every branching path verified.<br>Zero exceptions remain.<span class="cursor">█</span></div>
</main>
<!-- Terminal Console Log -->
<div class="mt-auto relative z-20 font-terminal">
<div class="border-t border-terminal-navy/30 pt-6 flex flex-col gap-1">
<p class="text-[14px] text-terminal-navy font-bold uppercase tracking-widest opacity-60">
                    &gt; SYSTEM_STATUS: V_OPTIMIZED
                </p>
<p class="text-[14px] text-terminal-navy font-bold uppercase tracking-widest opacity-60">
                    &gt; ENTROPY_MEASUREMENT: 0.000
                </p>
</div>
</div>
<!-- Pulsing Spade Symbol -->
<div class="absolute bottom-[80px] right-[80px] z-20">
<span class="spade-symbol text-terminal-navy">♠</span>
</div>
</div>
<script>
        // Typing Animation Logic
        const text = "2,598,960 possible outcomes.
Every combination mapped.
Every branching path verified.
Zero exceptions remain.";
        const container = document.getElementById('typewriter');
        let index = 0;
        const duration = 2000; // 2 seconds total for typing
        const speed = duration / text.length;

        function type() {
            if (index < text.length) {
                // Determine what to add
                if (text.charAt(index) === '\n') {
                    container.innerHTML += '<br>';
                } else {
                    container.innerHTML += text.charAt(index);
                }

                index++;

                // Refresh cursor position
                const existingCursor = document.querySelector('.cursor');
                if (existingCursor) existingCursor.remove();

                const cursor = document.createElement('span');
                cursor.className = 'cursor';
                cursor.innerHTML = '█';
                container.appendChild(cursor);

                setTimeout(type, speed);
            }
        }

        // Initialize typing
        window.onload = () => {
            // Clear initially to avoid duplicate if server-rendered with content
            container.innerHTML = '';
            type();
        };

        // Micro-interaction: Mouse parallax on glass
        document.addEventListener('mousemove', (e) => {
            const glass = document.querySelector('.crt-glass');
            if (glass) {
                const x = (e.clientX / window.innerWidth - 0.5) * 10;
                const y = (e.clientY / window.innerHeight - 0.5) * 10;
                glass.style.transform = `translate(${x}px, ${y}px)`;
            }
        });
    </script>






</body></html>
